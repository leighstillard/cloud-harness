name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created at the dispatched ref if it does not exist), e.g. v0.1.0"
        required: true

permissions:
  contents: write

# One release run per tag at a time, so two dispatches for the same new tag
# cannot both pass the existing-tag check and upload mismatched assets.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Refuse to rebuild an existing tag from another commit
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet  # checkout leaves a lightweight local tag; let the annotated one replace it
          if existing=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            [ "$existing" = "$GITHUB_SHA" ] || { echo "tag $TAG is at $existing, not $GITHUB_SHA" >&2; exit 1; }
          fi
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/harness-${target%/*}-${target#*/}" ./cmd/harness
          done
          (cd dist && sha256sum harness-* > SHA256SUMS)
          ls -l dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
