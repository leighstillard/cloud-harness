name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7 # v6+ honours the toolchain directive in go.mod
        with:
          go-version-file: go.mod
      - name: toolchain is the pinned one
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          go version | grep -q " $want " || { echo "go version is $(go version), want $want" >&2; exit 1; }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: CGO_ENABLED=0 go build ./cmd/harness
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... # pinned scanner; it still queries the live vuln database
      - name: shellcheck
        run: shellcheck cloud/setup.sh.example
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate plugins/harness
